<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>SpanTunnel — 主题自适应图标</title>
  <desc>两个小圆点通过水平连线穿过中央椭圆传送门；亮色=白底黑线，暗色=黑底白线，随系统配色自动切换。</desc>
  <style>
    .bg { fill: #FFFFFF; }
    .line { stroke: #000000; }
    .dot { fill: #000000; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #000000; }
      .line { stroke: #FFFFFF; }
      .dot { fill: #FFFFFF; }
    }
  </style>
  <rect class="bg" x="16" y="16" width="992" height="992" rx="218"/>
  <g class="line" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M117 519H907"/>
    <ellipse cx="512" cy="519" rx="84" ry="237"/>
  </g>
  <g class="dot">
    <circle cx="117" cy="519" r="30"/>
    <circle cx="907" cy="519" r="30"/>
  </g>
</svg>
